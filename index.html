<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sprocket Generator — Web DXF &amp; STL</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #0f172a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --secondary: #38bdf8;
      --secondary-hover: #0284c7;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      background: #111827;
    }
    header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
    }
    header span {
      color: var(--muted);
      font-size: 0.85rem;
    }
    main {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 16px;
      padding: 16px;
      max-width: 1260px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }
    @media (max-width: 880px) {
      main { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 10px 0;
    }
    .group { margin-bottom: 12px; }
    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }
    label {
      display: block;
      font-size: 0.88rem;
      margin-bottom: 4px;
      color: #e2e8f0;
    }
    .label-row label { margin-bottom: 0; }
    .reset-hint {
      font-size: 0.78rem;
      color: var(--secondary);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      width: auto;
      font-weight: 500;
    }
    .reset-hint:hover { color: #7dd3fc; }
    select, input[type="number"] {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 0.95rem;
    }
    input[readonly] {
      opacity: 0.7;
      cursor: not-allowed;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    .range-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--muted);
    }

    /* Feature tiles (2x2 square grid) */
    .tile-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .tile-btn {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 8px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .tile-btn:hover {
      border-color: var(--secondary);
    }
    .tile-btn.active {
      border-color: var(--secondary);
      background: rgba(56, 189, 248, 0.14);
    }
    .tile-btn svg {
      width: 24px;
      height: 24px;
      stroke: var(--secondary);
      fill: none;
      stroke-width: 1.8;
    }
    .tile-title {
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
    }
    .tile-sub {
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.2;
      text-align: center;
    }
    .sub-panel {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .three-col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .hidden { display: none !important; }

    button.btn-dxf, button.btn-stl {
      width: 100%;
      padding: 11px 14px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.15s ease;
    }
    .btn-dxf {
      background: var(--accent);
      color: #052e16;
    }
    .btn-dxf:hover { background: var(--accent-hover); }
    .btn-stl {
      background: var(--secondary);
      color: #082f49;
    }
    .btn-stl:hover { background: var(--secondary-hover); color: #f8fafc; }

    .preview-wrap {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 500px;
    }
    .canvas-box {
      flex: 1;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #glCanvas {
      cursor: grab;
    }
    #glCanvas:active {
      cursor: grabbing;
    }

    /* Floating viewport switcher & 3D controls */
    .viewport-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
      gap: 8px;
      flex-wrap: wrap;
    }
    .mode-switch, .view-tools {
      pointer-events: auto;
      display: inline-flex;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 3px;
      gap: 3px;
    }
    .vp-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .vp-btn:hover {
      color: var(--text);
    }
    .vp-btn.active {
      background: var(--secondary);
      color: #082f49;
    }
    .vp-btn.active-alt {
      background: rgba(56, 189, 248, 0.22);
      color: #7dd3fc;
    }
    .controls-hint {
      position: absolute;
      bottom: 10px;
      left: 12px;
      font-size: 0.75rem;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(51, 65, 85, 0.7);
      padding: 4px 9px;
      border-radius: 6px;
      pointer-events: none;
      z-index: 10;
    }

    .meta {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .meta code {
      color: #86efac;
      background: rgba(34, 197, 94, 0.1);
      padding: 2px 6px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Sprocket Generator — DXF &amp; STL</h1>
    <span>Live 2D &amp; 3D Preview • Shaft Bore &amp; Boss • Bolt &amp; Weight Relief Holes • Watertight STL</span>
  </header>

  <main>
    <aside class="card">
      <h2 class="section-title">1. Chain Parameters</h2>
      <div class="group">
        <label for="chainSelect">Chain Standard</label>
        <select id="chainSelect"></select>
      </div>
      <div class="two-col">
        <div class="group">
          <label for="pitchInput">Pitch (P) [mm]</label>
          <input type="number" id="pitchInput" step="0.001" min="0.1" />
        </div>
        <div class="group">
          <label for="rollerInput">Roller (D) [mm]</label>
          <input type="number" id="rollerInput" step="0.001" min="0.1" />
        </div>
      </div>

      <h2 class="section-title" style="margin-top:14px;">2. Sprocket Geometry</h2>
      <div class="two-col">
        <div class="group">
          <label for="teethInput">Teeth (Z)</label>
          <input type="number" id="teethInput" min="5" max="500" step="1" value="26" />
        </div>
        <div class="group">
          <label for="holeInput">Shaft Bore [mm]</label>
          <input type="number" id="holeInput" min="0" max="500" step="0.5" value="20" />
        </div>
      </div>
      <div class="group">
        <div class="label-row">
          <label for="thicknessInput">Rim Thickness (3D STL) [mm]</label>
          <button type="button" id="resetThicknessBtn" class="reset-hint" title="Reset to standard thickness">Default: 7.2 mm</button>
        </div>
        <input type="number" id="thicknessInput" min="0.2" max="500" step="0.1" value="7.2" />
      </div>

      <h2 class="section-title" style="margin-top:14px;">3. Bore, Shaft Boss &amp; Fasteners</h2>
      <div class="tile-grid">
        <button type="button" id="boreTileBtn" class="tile-btn active">
          <svg viewBox="0 0 32 32">
            <circle cx="16" cy="17" r="9" />
            <path d="M13 8.5 V5 H19 V8.5" />
          </svg>
          <span class="tile-title">Shaft Bore</span>
          <span class="tile-sub" id="boreTileSub">round</span>
        </button>

        <button type="button" id="hubTileBtn" class="tile-btn">
          <svg viewBox="0 0 32 32">
            <circle cx="16" cy="16" r="11" stroke-dasharray="3 2" />
            <circle cx="16" cy="16" r="6" />
          </svg>
          <span class="tile-title">Shaft Boss</span>
          <span class="tile-sub" id="hubTileSub">none</span>
        </button>

        <button type="button" id="boltsTileBtn" class="tile-btn">
          <svg viewBox="0 0 32 32">
            <circle cx="16" cy="16" r="10" stroke-dasharray="2 2" />
            <circle cx="16" cy="6" r="2.2" />
            <circle cx="24.6" cy="11" r="2.2" />
            <circle cx="24.6" cy="21" r="2.2" />
            <circle cx="16" cy="26" r="2.2" />
            <circle cx="7.4" cy="21" r="2.2" />
            <circle cx="7.4" cy="11" r="2.2" />
          </svg>
          <span class="tile-title">Bolt Holes</span>
          <span class="tile-sub" id="boltsTileSub">none</span>
        </button>

        <button type="button" id="reliefTileBtn" class="tile-btn">
          <svg viewBox="0 0 32 32">
            <circle cx="16" cy="16" r="11.5" />
            <circle cx="16" cy="8.5" r="3" />
            <circle cx="22.5" cy="19.5" r="3" />
            <circle cx="9.5" cy="19.5" r="3" />
          </svg>
          <span class="tile-title">Weight Relief</span>
          <span class="tile-sub" id="reliefTileSub">none</span>
        </button>
      </div>

      <!-- 1. Bore Sub-panel -->
      <div id="borePanel" class="sub-panel">
        <div class="group" style="margin-bottom:8px;">
          <label for="boreTypeSelect">Shaft Bore Profile</label>
          <select id="boreTypeSelect">
            <option value="round">Round (Circle)</option>
            <option value="keyway">Keyway (DIN / Rectangular)</option>
            <option value="dshaft">D-Shaft (Flat Cut)</option>
          </select>
        </div>
        <div id="keywayFields" class="two-col hidden">
          <div class="group" style="margin-bottom:0;">
            <label for="keyWidthInput">Key Width [mm]</label>
            <input type="number" id="keyWidthInput" min="0.5" max="100" step="0.1" value="6" />
          </div>
          <div class="group" style="margin-bottom:0;">
            <label for="keyDepthInput">Key Depth [mm]</label>
            <input type="number" id="keyDepthInput" min="0.2" max="50" step="0.1" value="2.8" />
          </div>
        </div>
        <div id="dshaftFields" class="group hidden" style="margin-bottom:0;">
          <label for="dFlatInput">Flat Cut Depth [mm]</label>
          <input type="number" id="dFlatInput" min="0.2" max="100" step="0.1" value="2.0" />
        </div>
      </div>

      <!-- 2. Hub (Shaft Boss) Sub-panel -->
      <div id="hubPanel" class="sub-panel hidden">
        <div class="group" style="margin-bottom:8px;">
          <label for="hubEnabledSelect">Shaft Boss (Hub Collar)</label>
          <select id="hubEnabledSelect">
            <option value="none">None (Flat Rim Only)</option>
            <option value="hub">Cylindrical Boss (3D STL &amp; DXF)</option>
          </select>
        </div>
        <div id="hubFields" class="two-col hidden">
          <div class="group" style="margin-bottom:0;">
            <label for="hubDiaInput">Boss Dia [mm]</label>
            <input type="number" id="hubDiaInput" min="1" max="500" step="0.5" value="36" />
          </div>
          <div class="group" style="margin-bottom:0;">
            <label for="hubHeightInput">Boss Height [mm]</label>
            <input type="number" id="hubHeightInput" min="0.5" max="500" step="0.5" value="16" />
          </div>
        </div>
      </div>

      <!-- 3. Bolt Holes Sub-panel -->
      <div id="boltsPanel" class="sub-panel hidden">
        <div class="group" style="margin-bottom:8px;">
          <label for="boltsEnabledSelect">Bolt Circle Holes</label>
          <select id="boltsEnabledSelect">
            <option value="none">None</option>
            <option value="bolts">Bolt Circle Pattern</option>
          </select>
        </div>
        <div id="boltsFields" class="three-col hidden">
          <div class="group" style="margin-bottom:0;">
            <label for="boltCountInput">Count</label>
            <input type="number" id="boltCountInput" min="1" max="60" step="1" value="6" />
          </div>
          <div class="group" style="margin-bottom:0;">
            <label for="boltDiaInput">Hole Ø [mm]</label>
            <input type="number" id="boltDiaInput" min="0.5" max="200" step="0.5" value="5" />
          </div>
          <div class="group" style="margin-bottom:0;">
            <label for="boltPcdInput">PCD Ø [mm]</label>
            <input type="number" id="boltPcdInput" min="1" max="1000" step="0.5" value="44" />
          </div>
        </div>
      </div>

      <!-- 4. Weight Relief Holes Sub-panel -->
      <div id="reliefPanel" class="sub-panel hidden">
        <div class="group" style="margin-bottom:8px;">
          <label for="reliefEnabledSelect">Weight Relief Holes</label>
          <select id="reliefEnabledSelect">
            <option value="none">None</option>
            <option value="relief">Circular Relief Cutouts</option>
          </select>
        </div>
        <div id="reliefFields" class="three-col hidden">
          <div class="group" style="margin-bottom:0;">
            <label for="reliefCountInput">Count</label>
            <input type="number" id="reliefCountInput" min="1" max="60" step="1" value="6" />
          </div>
          <div class="group" style="margin-bottom:0;">
            <label for="reliefDiaInput">Hole Ø [mm]</label>
            <input type="number" id="reliefDiaInput" min="1" max="300" step="0.5" value="14" />
          </div>
          <div class="group" style="margin-bottom:0;">
            <label for="reliefPcdInput">Ring Ø [mm]</label>
            <input type="number" id="reliefPcdInput" min="2" max="1000" step="0.5" value="64" />
          </div>
        </div>
      </div>

      <div class="group">
        <div class="range-row">
          <label for="stepsInput" style="margin:0;">Arc Smoothness (segments)</label>
          <span id="stepsValue">15</span>
        </div>
        <input type="range" id="stepsInput" min="5" max="60" step="1" value="15" />
      </div>

      <button id="downloadDxfBtn" class="btn-dxf" type="button">DOWNLOAD DXF FILE</button>
      <button id="downloadStlBtn" class="btn-stl" type="button">DOWNLOAD STL FILE (3D)</button>
    </aside>

    <section class="card preview-wrap">
      <div class="canvas-box">
        <div class="viewport-bar">
          <div class="mode-switch">
            <button type="button" id="mode2dBtn" class="vp-btn active">2D CAD</button>
            <button type="button" id="mode3dBtn" class="vp-btn">3D STL</button>
          </div>
          <div id="tools3d" class="view-tools hidden">
            <button type="button" id="toggleEdgesBtn" class="vp-btn">Edges</button>
            <button type="button" id="resetCamBtn" class="vp-btn">Reset View</button>
          </div>
        </div>

        <canvas id="previewCanvas"></canvas>
        <canvas id="glCanvas" class="hidden"></canvas>

        <div id="controlsHint3d" class="controls-hint hidden">
          LMB: Rotate • RMB / Shift+LMB: Pan • Scroll: Zoom
        </div>
      </div>
      <div class="meta">
        <div>Files: <code id="filePreview">-</code></div>
        <div id="dimPreview">Pitch diameter: -</div>
      </div>
    </section>
  </main>

  <script>
    const CHAIN_DATA = {
      "#219 (Karting)": { pitch: 7.77, roller: 4.78, thickness: 4.5 },
      "#25 (Karting / ANSI 25)": { pitch: 6.35, roller: 3.30, thickness: 2.8 },
      "#35 (Karting / ANSI 35)": { pitch: 9.525, roller: 5.08, thickness: 4.3 },
      "#40 (Karting / ANSI 40)": { pitch: 12.70, roller: 7.95, thickness: 7.1 },
      "03-1 (5mm)": { pitch: 5.00, roller: 3.20, thickness: 2.3 },
      "04-1 (6mm)": { pitch: 6.00, roller: 3.30, thickness: 2.6 },
      "05B-1 (8mm)": { pitch: 8.00, roller: 5.00, thickness: 2.8 },
      '06B-1 (3/8")': { pitch: 9.525, roller: 6.35, thickness: 5.3 },
      '08B-1 (1/2")': { pitch: 12.70, roller: 8.51, thickness: 7.2 },
      '081 (1/2")': { pitch: 12.70, roller: 7.75, thickness: 3.0 },
      '084 (1/2")': { pitch: 12.70, roller: 7.75, thickness: 4.5 },
      '10B-1 (5/8")': { pitch: 15.875, roller: 10.16, thickness: 9.1 },
      '12B-1 (3/4")': { pitch: 19.05, roller: 12.07, thickness: 11.1 },
      '16B-1 (1")': { pitch: 25.40, roller: 15.88, thickness: 15.8 },
      '20B-1 (1 1/4")': { pitch: 31.75, roller: 19.05, thickness: 18.2 },
      '24B-1 (1 1/2")': { pitch: 38.10, roller: 25.40, thickness: 24.1 },
      '28B-1 (1 3/4")': { pitch: 44.45, roller: 27.94, thickness: 29.2 },
      '32B-1 (2")': { pitch: 50.80, roller: 29.21, thickness: 29.2 },
      '40B-1 (2 1/2")': { pitch: 63.50, roller: 39.37, thickness: 36.4 },
      "CUSTOM": { pitch: 0, roller: 0, thickness: 5.0 }
    };

    const TWO_PI = Math.PI * 2;
    const chainSelect = document.getElementById("chainSelect");
    const pitchInput = document.getElementById("pitchInput");
    const rollerInput = document.getElementById("rollerInput");
    const teethInput = document.getElementById("teethInput");
    const holeInput = document.getElementById("holeInput");
    const thicknessInput = document.getElementById("thicknessInput");
    const resetThicknessBtn = document.getElementById("resetThicknessBtn");
    const stepsInput = document.getElementById("stepsInput");
    const stepsValue = document.getElementById("stepsValue");

    const tileButtons = {
      bore: document.getElementById("boreTileBtn"),
      hub: document.getElementById("hubTileBtn"),
      bolts: document.getElementById("boltsTileBtn"),
      relief: document.getElementById("reliefTileBtn")
    };
    const subPanels = {
      bore: document.getElementById("borePanel"),
      hub: document.getElementById("hubPanel"),
      bolts: document.getElementById("boltsPanel"),
      relief: document.getElementById("reliefPanel")
    };

    const boreTileSub = document.getElementById("boreTileSub");
    const hubTileSub = document.getElementById("hubTileSub");
    const boltsTileSub = document.getElementById("boltsTileSub");
    const reliefTileSub = document.getElementById("reliefTileSub");

    const boreTypeSelect = document.getElementById("boreTypeSelect");
    const keywayFields = document.getElementById("keywayFields");
    const keyWidthInput = document.getElementById("keyWidthInput");
    const keyDepthInput = document.getElementById("keyDepthInput");
    const dshaftFields = document.getElementById("dshaftFields");
    const dFlatInput = document.getElementById("dFlatInput");

    const hubEnabledSelect = document.getElementById("hubEnabledSelect");
    const hubFields = document.getElementById("hubFields");
    const hubDiaInput = document.getElementById("hubDiaInput");
    const hubHeightInput = document.getElementById("hubHeightInput");

    const boltsEnabledSelect = document.getElementById("boltsEnabledSelect");
    const boltsFields = document.getElementById("boltsFields");
    const boltCountInput = document.getElementById("boltCountInput");
    const boltDiaInput = document.getElementById("boltDiaInput");
    const boltPcdInput = document.getElementById("boltPcdInput");

    const reliefEnabledSelect = document.getElementById("reliefEnabledSelect");
    const reliefFields = document.getElementById("reliefFields");
    const reliefCountInput = document.getElementById("reliefCountInput");
    const reliefDiaInput = document.getElementById("reliefDiaInput");
    const reliefPcdInput = document.getElementById("reliefPcdInput");

    const downloadDxfBtn = document.getElementById("downloadDxfBtn");
    const downloadStlBtn = document.getElementById("downloadStlBtn");

    const mode2dBtn = document.getElementById("mode2dBtn");
    const mode3dBtn = document.getElementById("mode3dBtn");
    const tools3d = document.getElementById("tools3d");
    const toggleEdgesBtn = document.getElementById("toggleEdgesBtn");
    const resetCamBtn = document.getElementById("resetCamBtn");
    const controlsHint3d = document.getElementById("controlsHint3d");

    const canvas = document.getElementById("previewCanvas");
    const ctx = canvas.getContext("2d");
    const glCanvas = document.getElementById("glCanvas");
    const filePreview = document.getElementById("filePreview");
    const dimPreview = document.getElementById("dimPreview");

    let customBoltPcd = false;
    let customReliefPcd = false;
    let viewMode = "2d"; // "2d" | "3d"
    let showEdges3D = false;

    for (const name of Object.keys(CHAIN_DATA)) {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      chainSelect.appendChild(opt);
    }
    chainSelect.value = '08B-1 (1/2")';

    function getDefaultThickness() {
      const info = CHAIN_DATA[chainSelect.value];
      return info && typeof info.thickness === "number" ? info.thickness : 5.0;
    }

    function updateThicknessHint() {
      resetThicknessBtn.textContent = `Default: ${getDefaultThickness()} mm`;
    }

    function mod2Pi(a) {
      return ((a % TWO_PI) + TWO_PI) % TWO_PI;
    }

    function interpolateArc(center, r, startAngle, endAngle, steps = 15) {
      let a0 = mod2Pi(startAngle);
      let a1 = mod2Pi(endAngle);
      let diff = a1 - a0;
      if (diff > Math.PI) a1 -= TWO_PI;
      else if (diff < -Math.PI) a1 += TWO_PI;

      const pts = [];
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const a = a0 + t * (a1 - a0);
        pts.push([center[0] + r * Math.cos(a), center[1] + r * Math.sin(a)]);
      }
      return pts;
    }

    function generateSprocketPoints(P, D, N, stepsPerArc = 15) {
      const Rp = P / (2 * Math.sin(Math.PI / N));
      const xc = Rp * Math.cos(Math.PI / N);
      const yc = P / 2;

      const R1 = D / 2 + 0.1;
      const ratio = Math.max(-1, Math.min(1, (R1 - 0.2 * P) / R1));
      const thetaSweep = Math.acos(ratio);

      const d_L1_x = Math.cos(Math.PI + thetaSweep);
      const d_L1_y = Math.sin(Math.PI + thetaSweep);
      const P_1end_top = [xc + R1 * d_L1_x, yc + R1 * d_L1_y];

      let X_tip = xc - R1 + 0.6 * P;
      const maxXTip = xc + 0.32 * P;
      if (X_tip > maxXTip) X_tip = maxXTip;

      const P_tip_top = [X_tip, 0.05 * P];
      const P_tip_bot = [X_tip, -0.05 * P];

      const v12_x = P_tip_top[0] - P_1end_top[0];
      const v12_y = P_tip_top[1] - P_1end_top[1];
      const dot = d_L1_x * v12_x + d_L1_y * v12_y;

      let baseTooth;
      const P_1end_bot = [P_1end_top[0], -P_1end_top[1]];
      const C_bot = [xc, -yc];
      const C_top = [xc, yc];

      if (dot > 1e-4) {
        const s = (v12_x * v12_x + v12_y * v12_y) / (2 * dot);
        const C2_top = [P_1end_top[0] + s * d_L1_x, P_1end_top[1] + s * d_L1_y];
        const R2_top = Math.hypot(C2_top[0] - P_1end_top[0], C2_top[1] - P_1end_top[1]);
        const C2_bot = [C2_top[0], -C2_top[1]];

        const a_bot_flank_start = Math.atan2(P_1end_bot[1] - C2_bot[1], P_1end_bot[0] - C2_bot[0]);
        const a_bot_flank_end = Math.atan2(P_tip_bot[1] - C2_bot[1], P_tip_bot[0] - C2_bot[0]);
        const a_top_flank_start = Math.atan2(P_tip_top[1] - C2_top[1], P_tip_top[0] - C2_top[0]);
        const a_top_flank_end = Math.atan2(P_1end_top[1] - C2_top[1], P_1end_top[0] - C2_top[0]);

        baseTooth = [
          ...interpolateArc(C_bot, R1, Math.PI - Math.PI / N, Math.PI - thetaSweep, stepsPerArc),
          ...interpolateArc(C2_bot, R2_top, a_bot_flank_start, a_bot_flank_end, stepsPerArc),
          P_tip_top,
          ...interpolateArc(C2_top, R2_top, a_top_flank_start, a_top_flank_end, stepsPerArc),
          ...interpolateArc(C_top, R1, Math.PI + thetaSweep, Math.PI + Math.PI / N, stepsPerArc),
        ];
      } else {
        baseTooth = [
          ...interpolateArc(C_bot, R1, Math.PI - Math.PI / N, Math.PI - thetaSweep, stepsPerArc),
          P_tip_bot,
          P_tip_top,
          ...interpolateArc(C_top, R1, Math.PI + thetaSweep, Math.PI + Math.PI / N, stepsPerArc),
        ];
      }

      const allPoints = [];
      for (let i = 0; i < N; i++) {
        const angle = i * (TWO_PI / N);
        const ca = Math.cos(angle);
        const sa = Math.sin(angle);
        for (const [x, y] of baseTooth) {
          const xr = x * ca - y * sa;
          const yr = x * sa + y * ca;
          const last = allPoints[allPoints.length - 1];
          if (!last || Math.hypot(last[0] - xr, last[1] - yr) > 1e-4) {
            allPoints.push([xr, yr]);
          }
        }
      }
      return allPoints;
    }

    function generateBorePolygon(params, circleSegments = 96) {
      const r = params.holeDia / 2;
      if (r <= 0) return [];

      if (params.boreType === "keyway") {
        const halfW = Math.min(params.keyWidth / 2, r * 0.9);
        const yTop = r + Math.max(0, params.keyDepth);
        const yStart = Math.sqrt(Math.max(0, r * r - halfW * halfW));
        const aRight = Math.atan2(yStart, halfW);
        const aLeft = Math.atan2(yStart, -halfW);

        const pts = [];
        pts.push([halfW, yStart]);
        pts.push([halfW, yTop]);
        pts.push([-halfW, yTop]);
        pts.push([-halfW, yStart]);

        const totalArc = TWO_PI - (aLeft - aRight);
        for (let i = 1; i < circleSegments; i++) {
          const a = aLeft + (i / circleSegments) * totalArc;
          pts.push([r * Math.cos(a), r * Math.sin(a)]);
        }
        return pts;
      }

      if (params.boreType === "dshaft") {
        const flatCut = Math.min(Math.max(0, params.dFlat), r * 1.5);
        const yFlat = r - flatCut;
        if (yFlat <= -r) return [];
        const xHalf = Math.sqrt(Math.max(0, r * r - yFlat * yFlat));
        const aRight = Math.atan2(yFlat, xHalf);
        const aLeft = Math.atan2(yFlat, -xHalf);

        const pts = [];
        pts.push([xHalf, yFlat]);
        pts.push([-xHalf, yFlat]);

        const totalArc = TWO_PI - (aLeft - aRight);
        for (let i = 1; i < circleSegments; i++) {
          const a = aLeft + (i / circleSegments) * totalArc;
          pts.push([r * Math.cos(a), r * Math.sin(a)]);
        }
        return pts;
      }

      const pts = [];
      for (let i = 0; i < circleSegments; i++) {
        const a = (i / circleSegments) * TWO_PI;
        pts.push([r * Math.cos(a), r * Math.sin(a)]);
      }
      return pts;
    }

    function createCircleLoop(cx, cy, r, segs = 36) {
      const pts = [];
      for (let i = 0; i < segs; i++) {
        const a = (i / segs) * TWO_PI;
        pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
      }
      return pts;
    }

    function computeSafeDefaultRingDia(holeDia, holeCutoutDia, minOuterR, fraction = 0.55) {
      const innerR = Math.max(0, holeDia / 2);
      const holeR = Math.max(0.5, holeCutoutDia / 2);
      const outerLimitR = Math.max(innerR + holeR * 2 + 1, minOuterR * 0.88);
      const minRingR = innerR + holeR + 2.0;
      const maxRingR = Math.max(minRingR + 0.5, outerLimitR - holeR);
      const targetR = minRingR + (maxRingR - minRingR) * fraction;
      return Math.round(targetR * 2 * 10) / 10;
    }

    function syncDefaultRingDiameters(minOuterR) {
      if (!(minOuterR > 0 && isFinite(minOuterR))) return;
      const holeDia = parseFloat(holeInput.value) || 0;
      const hasHub = hubEnabledSelect.value === "hub";
      const hubDia = hasHub ? (parseFloat(hubDiaInput.value) || 0) : 0;
      const effectiveInnerDia = Math.max(holeDia, hubDia);

      if (!customBoltPcd) {
        const bDia = parseFloat(boltDiaInput.value) || 5;
        boltPcdInput.value = computeSafeDefaultRingDia(effectiveInnerDia, bDia, minOuterR, 0.22);
      }
      if (!customReliefPcd) {
        const rDia = parseFloat(reliefDiaInput.value) || 14;
        reliefPcdInput.value = computeSafeDefaultRingDia(effectiveInnerDia, rDia, minOuterR, 0.68);
      }
    }

    function getHoleCircles(count, dia, pcd, maxOuterR, minInnerR, phaseSteps = 0, avoidCircles = [], minWallGap = 1.5, hubR = 0) {
      const circles = [];
      if (!(count >= 1 && dia > 0 && pcd > 0)) return circles;
      const ringR = pcd / 2;
      const holeR = dia / 2;
      if (ringR + holeR >= maxOuterR * 0.96) return circles;
      if (ringR - holeR <= minInnerR + 0.3) return circles;
      if (hubR > 0 && Math.abs(ringR - hubR) < holeR + 0.4) return circles;

      for (let i = 0; i < count; i++) {
        const ang = ((i + phaseSteps) / count) * TWO_PI;
        const cx = ringR * Math.cos(ang);
        const cy = ringR * Math.sin(ang);

        let collides = false;
        for (const other of avoidCircles) {
          const dist = Math.hypot(cx - other.cx, cy - other.cy);
          if (dist < holeR + other.r + minWallGap) {
            collides = true;
            break;
          }
        }
        if (!collides) {
          circles.push({ cx, cy, r: holeR });
        }
      }
      return circles;
    }

    function getCutoutLayout(params, minOuterR) {
      let minInnerR = params.holeDia > 0 ? params.holeDia / 2 : 0;
      if (params.holeDia > 0 && params.boreType === "keyway") {
        minInnerR = Math.max(minInnerR, params.holeDia / 2 + params.keyDepth);
      }
      const hubR = params.hasHub && params.hubHeight > params.thickness + 0.05 ? params.hubDia / 2 : 0;
      const boltCircles = params.hasBolts
        ? getHoleCircles(params.boltCount, params.boltDia, params.boltPcd, minOuterR, minInnerR, 0, [], 1.5, hubR)
        : [];
      const reliefPhase = params.hasBolts ? 0.5 : 0;
      const reliefCircles = params.hasRelief
        ? getHoleCircles(params.reliefCount, params.reliefDia, params.reliefPcd, minOuterR, minInnerR, reliefPhase, boltCircles, 1.5, hubR)
        : [];
      return { boltCircles, reliefCircles };
    }

    function getParams() {
      const P = parseFloat(pitchInput.value);
      const D = parseFloat(rollerInput.value);
      const N = parseInt(teethInput.value, 10);
      const holeDia = parseFloat(holeInput.value);
      const thickness = parseFloat(thicknessInput.value);
      const steps = parseInt(stepsInput.value, 10);

      const boreType = boreTypeSelect.value;
      const keyWidth = parseFloat(keyWidthInput.value) || 0;
      const keyDepth = parseFloat(keyDepthInput.value) || 0;
      const dFlat = parseFloat(dFlatInput.value) || 0;

      const hasHub = hubEnabledSelect.value === "hub";
      const hubDia = parseFloat(hubDiaInput.value) || 0;
      const hubHeight = parseFloat(hubHeightInput.value) || thickness;

      const hasBolts = boltsEnabledSelect.value === "bolts";
      const boltCount = parseInt(boltCountInput.value, 10) || 0;
      const boltDia = parseFloat(boltDiaInput.value) || 0;
      const boltPcd = parseFloat(boltPcdInput.value) || 0;

      const hasRelief = reliefEnabledSelect.value === "relief";
      const reliefCount = parseInt(reliefCountInput.value, 10) || 0;
      const reliefDia = parseFloat(reliefDiaInput.value) || 0;
      const reliefPcd = parseFloat(reliefPcdInput.value) || 0;

      const chainShort = chainSelect.value.split(" ")[0].replace("#", "ANSI");
      const boreTag = boreType === "round" ? "" : `_${boreType}`;
      const hubTag = hasHub ? `_H${Math.round(hubDia)}x${hubHeight}` : "";
      const boltTag = hasBolts ? `_B${boltCount}x${boltDia}` : "";
      const reliefTag = hasRelief ? `_R${reliefCount}x${reliefDia}` : "";
      const base = `${chainShort}_Z${N}_D${Math.round(holeDia)}${boreTag}${boltTag}${reliefTag}`;
      return {
        P, D, N, holeDia, thickness, steps,
        boreType, keyWidth, keyDepth, dFlat,
        hasHub, hubDia, hubHeight,
        hasBolts, boltCount, boltDia, boltPcd,
        hasRelief, reliefCount, reliefDia, reliefPcd,
        dxfName: `${base}.dxf`,
        stlName: `${base}_T${thickness}${hubTag}.stl`
      };
    }

    function syncFeatureUi() {
      const boreType = boreTypeSelect.value;
      keywayFields.classList.toggle("hidden", boreType !== "keyway");
      dshaftFields.classList.toggle("hidden", boreType !== "dshaft");
      boreTileSub.textContent = boreType === "round" ? "round" : (boreType === "keyway" ? "keyway" : "D-shaft");

      const hasHub = hubEnabledSelect.value === "hub";
      hubFields.classList.toggle("hidden", !hasHub);
      hubTileSub.textContent = hasHub ? `Ø${hubDiaInput.value}` : "none";

      const hasBolts = boltsEnabledSelect.value === "bolts";
      boltsFields.classList.toggle("hidden", !hasBolts);
      boltsTileSub.textContent = hasBolts ? `${boltCountInput.value}×Ø${boltDiaInput.value}` : "none";

      const hasRelief = reliefEnabledSelect.value === "relief";
      reliefFields.classList.toggle("hidden", !hasRelief);
      reliefTileSub.textContent = hasRelief ? `${reliefCountInput.value}×Ø${reliefDiaInput.value}` : "none";
    }

    function syncChainFields() {
      const choice = chainSelect.value;
      if (choice !== "CUSTOM" && CHAIN_DATA[choice]) {
        pitchInput.value = CHAIN_DATA[choice].pitch;
        rollerInput.value = CHAIN_DATA[choice].roller;
        thicknessInput.value = CHAIN_DATA[choice].thickness;
        pitchInput.readOnly = true;
        rollerInput.readOnly = true;
      } else {
        thicknessInput.value = CHAIN_DATA.CUSTOM.thickness;
        pitchInput.readOnly = false;
        rollerInput.readOnly = false;
      }
      updateThicknessHint();
    }

    function appendDxfCircle(layer, cx, cy, r) {
      return (
        `0\nCIRCLE\n8\n${layer}\n` +
        `10\n${cx.toFixed(4)}\n20\n${cy.toFixed(4)}\n30\n0.0\n` +
        `40\n${r.toFixed(4)}\n`
      );
    }

    function buildDxf(pts, params) {
      let dxf = "0\nSECTION\n2\nHEADER\n9\n$ACADVER\n1\nAC1009\n0\nENDSEC\n0\nSECTION\n2\nENTITIES\n";
      for (let i = 0; i < pts.length; i++) {
        const p1 = pts[i];
        const p2 = pts[(i + 1) % pts.length];
        dxf +=
          `0\nLINE\n8\nOBRYS\n` +
          `10\n${p1[0].toFixed(4)}\n20\n${p1[1].toFixed(4)}\n30\n0.0\n` +
          `11\n${p2[0].toFixed(4)}\n21\n${p2[1].toFixed(4)}\n31\n0.0\n`;
      }

      const hr = params.holeDia / 2;
      if (hr > 0) {
        if (params.boreType === "round") {
          dxf += appendDxfCircle("OTWOR", 0, 0, hr);
        } else {
          const borePts = generateBorePolygon(params, 96);
          for (let i = 0; i < borePts.length; i++) {
            const b1 = borePts[i];
            const b2 = borePts[(i + 1) % borePts.length];
            dxf +=
              `0\nLINE\n8\nOTWOR\n` +
              `10\n${b1[0].toFixed(4)}\n20\n${b1[1].toFixed(4)}\n30\n0.0\n` +
              `11\n${b2[0].toFixed(4)}\n21\n${b2[1].toFixed(4)}\n31\n0.0\n`;
          }
        }
      }

      if (params.hasHub && params.hubDia > 0) {
        dxf += appendDxfCircle("PIASTA", 0, 0, params.hubDia / 2);
      }

      let minOuterR = Infinity;
      for (const [x, y] of pts) minOuterR = Math.min(minOuterR, Math.hypot(x, y));

      const { boltCircles, reliefCircles } = getCutoutLayout(params, minOuterR);
      for (const hc of boltCircles) dxf += appendDxfCircle("SRUBY", hc.cx, hc.cy, hc.r);
      for (const hc of reliefCircles) dxf += appendDxfCircle("ODCIAZENIE", hc.cx, hc.cy, hc.r);

      dxf += "0\nENDSEC\n0\nEOF\n";
      return dxf;
    }

    function computeNormal(a, b, c) {
      const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
      const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
      let nx = uy * vz - uz * vy;
      let ny = uz * vx - ux * vz;
      let nz = ux * vy - uy * vx;
      const len = Math.hypot(nx, ny, nz) || 1;
      return [nx / len, ny / len, nz / len];
    }

    function signedArea2D(poly) {
      let area = 0;
      for (let i = 0, n = poly.length; i < n; i++) {
        const [x1, y1] = poly[i];
        const [x2, y2] = poly[(i + 1) % n];
        area += x1 * y2 - x2 * y1;
      }
      return area * 0.5;
    }

    function cleanLoop(pts) {
      const out = [];
      for (const p of pts) {
        const prev = out[out.length - 1];
        if (!prev || Math.hypot(p[0] - prev[0], p[1] - prev[1]) > 1e-6) {
          out.push([p[0], p[1]]);
        }
      }
      if (out.length > 1 && Math.hypot(out[0][0] - out[out.length - 1][0], out[0][1] - out[out.length - 1][1]) <= 1e-6) {
        out.pop();
      }
      return out;
    }

    function cross2D(a, b, c) {
      return (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
    }

    function pointInTri2D(p, a, b, c) {
      const c1 = cross2D(a, b, p);
      const c2 = cross2D(b, c, p);
      const c3 = cross2D(c, a, p);
      return c1 >= -1e-9 && c2 >= -1e-9 && c3 >= -1e-9;
    }

    function samePt2D(a, b) {
      return Math.abs(a[0] - b[0]) < 1e-7 && Math.abs(a[1] - b[1]) < 1e-7;
    }

    function selectCornerCopyForPoint(poly, targetIdx, targetPt) {
      const P = poly[targetIdx];
      const n = poly.length;
      const dx = targetPt[0] - P[0];
      const dy = targetPt[1] - P[1];

      for (let i = 0; i < n; i++) {
        if (!samePt2D(poly[i], P)) continue;
        const A = poly[(i - 1 + n) % n];
        const B = poly[(i + 1) % n];
        const ux = A[0] - P[0], uy = A[1] - P[1];
        const vx = B[0] - P[0], vy = B[1] - P[1];
        const crossVU = vx * uy - vy * ux;
        const crossVD = vx * dy - vy * dx;
        const crossDU = dx * uy - dy * ux;

        if (crossVU > 1e-9) {
          if (crossVD >= -1e-9 && crossDU >= -1e-9) return i;
        } else {
          if (crossVD >= -1e-9 || crossDU >= -1e-9) return i;
        }
      }
      return targetIdx;
    }

    function triangulatePolygonWithHoles(outerInput, holesInput) {
      let outer = cleanLoop(outerInput);
      if (outer.length < 3) return [];
      if (signedArea2D(outer) < 0) outer.reverse();

      const holeList = [];
      for (const hRaw of holesInput) {
        const h = cleanLoop(hRaw);
        if (h.length < 3) continue;
        if (signedArea2D(h) > 0) h.reverse();
        let maxX = -Infinity;
        let maxIdx = 0;
        for (let i = 0; i < h.length; i++) {
          if (h[i][0] > maxX || (h[i][0] === maxX && h[i][1] > h[maxIdx][1])) {
            maxX = h[i][0];
            maxIdx = i;
          }
        }
        holeList.push({ pts: h, maxX, maxIdx });
      }

      holeList.sort((a, b) => b.maxX - a.maxX);

      for (const hole of holeList) {
        const hPts = hole.pts;
        const mIdx = hole.maxIdx;
        const M = hPts[mIdx];
        const mx = M[0];
        const my = M[1];

        let bestIx = Infinity;
        let candidateVIdx = -1;

        const n = outer.length;
        for (let i = 0; i < n; i++) {
          const A = outer[i];
          const B = outer[(i + 1) % n];

          if (Math.abs(A[1] - my) <= 1e-9 && A[0] >= mx - 1e-9) {
            if (A[0] < bestIx - 1e-9) {
              bestIx = A[0];
              candidateVIdx = i;
            }
          } else if ((A[1] < my && B[1] > my) || (B[1] < my && A[1] > my)) {
            const t = (my - A[1]) / (B[1] - A[1]);
            const ix = A[0] + t * (B[0] - A[0]);
            if (ix >= mx - 1e-9 && ix < bestIx - 1e-9) {
              bestIx = ix;
              candidateVIdx = A[0] >= B[0] ? i : (i + 1) % n;
            }
          }
        }

        if (candidateVIdx === -1) continue;

        const I = [bestIx, my];
        const P = outer[candidateVIdx];
        let visibleIdx = candidateVIdx;

        if (!samePt2D(I, P)) {
          let bestAngle = Math.abs(Math.atan2(P[1] - my, P[0] - mx));
          let bestDist = Math.hypot(P[0] - mx, P[1] - my);

          for (let i = 0; i < n; i++) {
            if (i === candidateVIdx) continue;
            const V = outer[i];
            if (samePt2D(V, M) || samePt2D(V, P)) continue;
            const inside = cross2D(M, I, P) >= 0
              ? pointInTri2D(V, M, I, P)
              : pointInTri2D(V, M, P, I);
            if (inside) {
              const ang = Math.abs(Math.atan2(V[1] - my, V[0] - mx));
              const dist = Math.hypot(V[0] - mx, V[1] - my);
              if (ang < bestAngle - 1e-7 || (Math.abs(ang - bestAngle) <= 1e-7 && dist < bestDist)) {
                bestAngle = ang;
                bestDist = dist;
                visibleIdx = i;
              }
            }
          }
        }

        visibleIdx = selectCornerCopyForPoint(outer, visibleIdx, M);

        const orderedHole = [];
        for (let k = 0; k < hPts.length; k++) {
          orderedHole.push(hPts[(mIdx + k) % hPts.length]);
        }

        outer = [
          ...outer.slice(0, visibleIdx + 1),
          ...orderedHole,
          orderedHole[0],
          outer[visibleIdx],
          ...outer.slice(visibleIdx + 1)
        ];
      }

      const total = outer.length;
      const prev = new Int32Array(total);
      const next = new Int32Array(total);
      const active = new Uint8Array(total);
      for (let i = 0; i < total; i++) {
        prev[i] = (i - 1 + total) % total;
        next[i] = (i + 1) % total;
        active[i] = 1;
      }

      const tris = [];
      let remaining = total;
      let cur = 0;
      let guard = 0;
      const maxGuard = total * total * 2 + 100;

      while (remaining >= 3 && guard < maxGuard) {
        guard++;
        if (!active[cur]) {
          cur = (cur + 1) % total;
          continue;
        }

        const p = prev[cur];
        const n = next[cur];
        const A = outer[p];
        const B = outer[cur];
        const C = outer[n];
        const area2 = cross2D(A, B, C);

        if (Math.abs(area2) <= 1e-11 || samePt2D(A, C)) {
          active[cur] = 0;
          next[p] = n;
          prev[n] = p;
          remaining--;
          cur = n;
          continue;
        }

        if (area2 > 1e-11) {
          let isEar = true;
          let scan = next[n];
          while (scan !== p) {
            const V = outer[scan];
            if (!samePt2D(V, A) && !samePt2D(V, B) && !samePt2D(V, C)) {
              if (pointInTri2D(V, A, B, C)) {
                isEar = false;
                break;
              }
            }
            scan = next[scan];
          }

          if (isEar) {
            tris.push([A, B, C]);
            active[cur] = 0;
            next[p] = n;
            prev[n] = p;
            remaining--;
            cur = n;
            continue;
          }
        }

        cur = n;
      }

      return tris;
    }

    // Shared 3D mesh generator used by both Binary STL export and live WebGL 3D preview
    function generateSprocketMesh(pts, params) {
      let minOuterR = Infinity;
      let maxOuterR = 1;
      for (const [x, y] of pts) {
        const r = Math.hypot(x, y);
        minOuterR = Math.min(minOuterR, r);
        maxOuterR = Math.max(maxOuterR, r);
      }

      const maxBoreAllowed = minOuterR * 0.92;
      const hasBore = params.holeDia > 0 && params.holeDia / 2 < maxBoreAllowed;
      const boreLoop = hasBore ? cleanLoop(generateBorePolygon(params, 72)) : [];
      if (boreLoop.length > 0 && signedArea2D(boreLoop) < 0) boreLoop.reverse();

      const outerLoop = cleanLoop(pts);
      if (outerLoop.length > 0 && signedArea2D(outerLoop) < 0) outerLoop.reverse();

      const z0 = 0;
      const zRim = params.thickness;
      const useHub =
        params.hasHub &&
        params.hubHeight > zRim + 0.05 &&
        params.hubDia / 2 < maxBoreAllowed &&
        (!hasBore || params.hubDia > params.holeDia + 0.5);

      const zHub = useHub ? params.hubHeight : zRim;
      const hubR = useHub ? params.hubDia / 2 : 0;
      const hubLoop = useHub ? createCircleLoop(0, 0, hubR, 72) : [];

      const { boltCircles, reliefCircles } = getCutoutLayout(params, minOuterR);
      const allCutouts = [...boltCircles, ...reliefCircles].map(hc => ({
        ...hc,
        loop: createCircleLoop(hc.cx, hc.cy, hc.r, 32),
        inHub: useHub && Math.hypot(hc.cx, hc.cy) + hc.r <= hubR - 0.2
      }));

      const triangles = [];
      function addTri(a, b, c) {
        const normal = computeNormal(a, b, c);
        triangles.push([normal, a, b, c]);
      }

      function addExtrudedWall(loopCCW, zLow, zHigh, outward) {
        const len = loopCCW.length;
        for (let i = 0; i < len; i++) {
          const p0 = loopCCW[i];
          const p1 = loopCCW[(i + 1) % len];
          if (outward) {
            addTri([p0[0], p0[1], zLow], [p1[0], p1[1], zLow], [p1[0], p1[1], zHigh]);
            addTri([p0[0], p0[1], zLow], [p1[0], p1[1], zHigh], [p0[0], p0[1], zHigh]);
          } else {
            addTri([p1[0], p1[1], zLow], [p0[0], p0[1], zLow], [p0[0], p0[1], zHigh]);
            addTri([p1[0], p1[1], zLow], [p0[0], p0[1], zHigh], [p1[0], p1[1], zHigh]);
          }
        }
      }

      addExtrudedWall(outerLoop, z0, zRim, true);

      if (hasBore && boreLoop.length >= 3) {
        addExtrudedWall(boreLoop, z0, zHub, false);
      }

      for (const hc of allCutouts) {
        addExtrudedWall(hc.loop, z0, hc.inHub ? zHub : zRim, false);
      }

      const bottomHoles = [];
      if (hasBore && boreLoop.length >= 3) bottomHoles.push(boreLoop);
      for (const hc of allCutouts) bottomHoles.push(hc.loop);

      const bottomTris = triangulatePolygonWithHoles(outerLoop, bottomHoles);
      for (const [a, b, c] of bottomTris) {
        addTri([a[0], a[1], z0], [c[0], c[1], z0], [b[0], b[1], z0]);
      }

      if (useHub) {
        const rimTopHoles = [hubLoop];
        for (const hc of allCutouts) {
          if (!hc.inHub) rimTopHoles.push(hc.loop);
        }
        const rimTopTris = triangulatePolygonWithHoles(outerLoop, rimTopHoles);
        for (const [a, b, c] of rimTopTris) {
          addTri([a[0], a[1], zRim], [b[0], b[1], zRim], [c[0], c[1], zRim]);
        }

        addExtrudedWall(hubLoop, zRim, zHub, true);

        const hubTopHoles = [];
        if (hasBore && boreLoop.length >= 3) hubTopHoles.push(boreLoop);
        for (const hc of allCutouts) {
          if (hc.inHub) hubTopHoles.push(hc.loop);
        }
        const hubTopTris = triangulatePolygonWithHoles(hubLoop, hubTopHoles);
        for (const [a, b, c] of hubTopTris) {
          addTri([a[0], a[1], zHub], [b[0], b[1], zHub], [c[0], c[1], zHub]);
        }
      } else {
        for (const [a, b, c] of bottomTris) {
          addTri([a[0], a[1], zRim], [b[0], b[1], zRim], [c[0], c[1], zRim]);
        }
      }

      return { triangles, maxOuterR, maxZ: zHub };
    }

    function buildBinaryStl(pts, params) {
      const { triangles } = generateSprocketMesh(pts, params);
      const triCount = triangles.length;
      const buffer = new ArrayBuffer(84 + triCount * 50);
      const view = new DataView(buffer);

      for (let i = 0; i < 80; i++) {
        view.setUint8(i, 0);
      }
      view.setUint32(80, triCount, true);

      let offset = 84;
      for (const [norm, v1, v2, v3] of triangles) {
        const verts = [norm, v1, v2, v3];
        for (const vec of verts) {
          view.setFloat32(offset, vec[0], true); offset += 4;
          view.setFloat32(offset, vec[1], true); offset += 4;
          view.setFloat32(offset, vec[2], true); offset += 4;
        }
        view.setUint16(offset, 0, true);
        offset += 2;
      }

      return buffer;
    }

    // ==================== WebGL 3D Viewer ====================
    const gl = glCanvas.getContext("webgl", { antialias: true, alpha: false });
    let glState = null;

    const cam = {
      yaw: 0.58,
      pitch: 0.72,
      distance: 180,
      target: [0, 0, 4],
      initialized: false
    };

    function resetCamera(maxR = 60, maxZ = 8) {
      cam.yaw = 0.58;
      cam.pitch = 0.74;
      cam.target = [0, 0, maxZ * 0.45];
      cam.distance = Math.max(30, maxR * 2.55);
      cam.initialized = true;
    }

    function initWebGL() {
      if (!gl || glState) return glState;

      const vsSrc = `
        attribute vec3 aPos;
        attribute vec3 aNorm;
        uniform mat4 uProj;
        uniform mat4 uView;
        varying vec3 vNorm;
        varying vec3 vPos;
        void main() {
          vPos = aPos;
          vNorm = aNorm;
          gl_Position = uProj * uView * vec4(aPos, 1.0);
        }
      `;
      const fsSrc = `
        precision mediump float;
        varying vec3 vNorm;
        varying vec3 vPos;
        uniform vec3 uBaseColor;
        uniform bool uUseLighting;
        uniform vec3 uCamPos;
        void main() {
          if (!uUseLighting) {
            gl_FragColor = vec4(uBaseColor, 1.0);
            return;
          }
          vec3 n = normalize(vNorm);
          if (!gl_FrontFacing) n = -n;
          vec3 light1 = normalize(vec3(0.45, 0.65, 0.85));
          vec3 light2 = normalize(vec3(-0.65, -0.45, 0.35));
          vec3 viewDir = normalize(uCamPos - vPos);

          float diff1 = max(dot(n, light1), 0.0);
          float diff2 = max(dot(n, light2), 0.0) * 0.38;
          float hemi = 0.30 + 0.14 * n.z;

          vec3 halfVec = normalize(light1 + viewDir);
          float spec = pow(max(dot(n, halfVec), 0.0), 36.0) * 0.24;

          vec3 col = uBaseColor * (hemi + diff1 * 0.70 + diff2) + vec3(spec);
          gl_FragColor = vec4(col, 1.0);
        }
      `;

      function compile(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
          console.error(gl.getShaderInfoLog(s));
          return null;
        }
        return s;
      }

      const vs = compile(gl.VERTEX_SHADER, vsSrc);
      const fs = compile(gl.FRAGMENT_SHADER, fsSrc);
      if (!vs || !fs) return null;

      const prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        console.error(gl.getProgramInfoLog(prog));
        return null;
      }

      glState = {
        prog,
        aPos: gl.getAttribLocation(prog, "aPos"),
        aNorm: gl.getAttribLocation(prog, "aNorm"),
        uProj: gl.getUniformLocation(prog, "uProj"),
        uView: gl.getUniformLocation(prog, "uView"),
        uBaseColor: gl.getUniformLocation(prog, "uBaseColor"),
        uUseLighting: gl.getUniformLocation(prog, "uUseLighting"),
        uCamPos: gl.getUniformLocation(prog, "uCamPos"),
        posBuf: gl.createBuffer(),
        normBuf: gl.createBuffer(),
        edgeBuf: gl.createBuffer(),
        gridBuf: gl.createBuffer(),
        triVertCount: 0,
        edgeVertCount: 0,
        gridVertCount: 0,
        lastMaxR: 60,
        lastMaxZ: 8
      };

      // Build print-bed grid at Z = 0
      const gridLines = [];
      const size = 120;
      const step = 10;
      for (let i = -size; i <= size; i += step) {
        gridLines.push(i, -size, 0, i, size, 0);
        gridLines.push(-size, i, 0, size, i, 0);
      }
      gl.bindBuffer(gl.ARRAY_BUFFER, glState.gridBuf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(gridLines), gl.STATIC_DRAW);
      glState.gridVertCount = gridLines.length / 3;

      return glState;
    }

    function updateWebGLMesh(pts, params) {
      const state = initWebGL();
      if (!state) return;

      const { triangles, maxOuterR, maxZ } = generateSprocketMesh(pts, params);
      state.lastMaxR = maxOuterR;
      state.lastMaxZ = maxZ;

      if (!cam.initialized) {
        resetCamera(maxOuterR, maxZ);
      }

      const triCount = triangles.length;
      const positions = new Float32Array(triCount * 9);
      const normals = new Float32Array(triCount * 9);
      const edges = new Float32Array(triCount * 18);

      let pIdx = 0;
      let eIdx = 0;
      for (let i = 0; i < triCount; i++) {
        const [n, a, b, c] = triangles[i];
        const verts = [a, b, c];
        for (let k = 0; k < 3; k++) {
          const v = verts[k];
          positions[pIdx] = v[0];
          positions[pIdx + 1] = v[1];
          positions[pIdx + 2] = v[2];
          normals[pIdx] = n[0];
          normals[pIdx + 1] = n[1];
          normals[pIdx + 2] = n[2];
          pIdx += 3;
        }
        // Triangle edges
        edges[eIdx++] = a[0]; edges[eIdx++] = a[1]; edges[eIdx++] = a[2];
        edges[eIdx++] = b[0]; edges[eIdx++] = b[1]; edges[eIdx++] = b[2];
        edges[eIdx++] = b[0]; edges[eIdx++] = b[1]; edges[eIdx++] = b[2];
        edges[eIdx++] = c[0]; edges[eIdx++] = c[1]; edges[eIdx++] = c[2];
        edges[eIdx++] = c[0]; edges[eIdx++] = c[1]; edges[eIdx++] = c[2];
        edges[eIdx++] = a[0]; edges[eIdx++] = a[1]; edges[eIdx++] = a[2];
      }

      gl.bindBuffer(gl.ARRAY_BUFFER, state.posBuf);
      gl.bufferData(gl.ARRAY_BUFFER, positions, gl.DYNAMIC_DRAW);

      gl.bindBuffer(gl.ARRAY_BUFFER, state.normBuf);
      gl.bufferData(gl.ARRAY_BUFFER, normals, gl.DYNAMIC_DRAW);

      gl.bindBuffer(gl.ARRAY_BUFFER, state.edgeBuf);
      gl.bufferData(gl.ARRAY_BUFFER, edges, gl.DYNAMIC_DRAW);

      state.triVertCount = triCount * 3;
      state.edgeVertCount = triCount * 6;
    }

    function mat4Perspective(fovRad, aspect, near, far) {
      const f = 1.0 / Math.tan(fovRad / 2);
      const nf = 1 / (near - far);
      return new Float32Array([
        f / aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, (far + near) * nf, -1,
        0, 0, 2 * far * near * nf, 0
      ]);
    }

    function mat4LookAt(eye, target, up) {
      let zx = eye[0] - target[0];
      let zy = eye[1] - target[1];
      let zz = eye[2] - target[2];
      let len = Math.hypot(zx, zy, zz) || 1;
      zx /= len; zy /= len; zz /= len;

      let xx = up[1] * zz - up[2] * zy;
      let xy = up[2] * zx - up[0] * zz;
      let xz = up[0] * zy - up[1] * zx;
      len = Math.hypot(xx, xy, xz) || 1;
      xx /= len; xy /= len; xz /= len;

      const yx = zy * xz - zz * xy;
      const yy = zz * xx - zx * xz;
      const yz = zx * xy - zy * xx;

      return new Float32Array([
        xx, yx, zx, 0,
        xy, yy, zy, 0,
        xz, yz, zz, 0,
        -(xx * eye[0] + xy * eye[1] + xz * eye[2]),
        -(yx * eye[0] + yy * eye[1] + yz * eye[2]),
        -(zx * eye[0] + zy * eye[1] + zz * eye[2]),
        1
      ]);
    }

    function render3D() {
      if (viewMode !== "3d") return;
      const state = initWebGL();
      if (!state) return;

      const dpr = window.devicePixelRatio || 1;
      const rect = glCanvas.getBoundingClientRect();
      const w = Math.max(1, Math.floor(rect.width * dpr));
      const h = Math.max(1, Math.floor(rect.height * dpr));
      if (glCanvas.width !== w || glCanvas.height !== h) {
        glCanvas.width = w;
        glCanvas.height = h;
      }

      gl.viewport(0, 0, w, h);
      gl.clearColor(0.035, 0.051, 0.086, 1.0);
      gl.enable(gl.DEPTH_TEST);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

      gl.useProgram(state.prog);

      const cosP = Math.cos(cam.pitch);
      const eye = [
        cam.target[0] + cam.distance * cosP * Math.cos(cam.yaw),
        cam.target[1] + cam.distance * cosP * Math.sin(cam.yaw),
        cam.target[2] + cam.distance * Math.sin(cam.pitch)
      ];

      const proj = mat4Perspective(Math.PI / 4, w / h, 0.5, 5000);
      const view = mat4LookAt(eye, cam.target, [0, 0, 1]);

      gl.uniformMatrix4fv(state.uProj, false, proj);
      gl.uniformMatrix4fv(state.uView, false, view);
      gl.uniform3fv(state.uCamPos, eye);

      // 1. Draw print bed grid at Z = 0
      gl.uniform1i(state.uUseLighting, 0);
      gl.uniform3f(state.uBaseColor, 0.14, 0.20, 0.30);
      gl.bindBuffer(gl.ARRAY_BUFFER, state.gridBuf);
      gl.enableVertexAttribArray(state.aPos);
      gl.vertexAttribPointer(state.aPos, 3, gl.FLOAT, false, 0, 0);
      gl.disableVertexAttribArray(state.aNorm);
      gl.vertexAttrib3f(state.aNorm, 0, 0, 1);
      gl.drawArrays(gl.LINES, 0, state.gridVertCount);

      // 2. Draw solid sprocket mesh
      if (state.triVertCount > 0) {
        gl.uniform1i(state.uUseLighting, 1);
        gl.uniform3f(state.uBaseColor, 0.22, 0.74, 0.97); // crisp metallic sky-blue CAD finish

        gl.bindBuffer(gl.ARRAY_BUFFER, state.posBuf);
        gl.enableVertexAttribArray(state.aPos);
        gl.vertexAttribPointer(state.aPos, 3, gl.FLOAT, false, 0, 0);

        gl.bindBuffer(gl.ARRAY_BUFFER, state.normBuf);
        gl.enableVertexAttribArray(state.aNorm);
        gl.vertexAttribPointer(state.aNorm, 3, gl.FLOAT, false, 0, 0);

        gl.enable(gl.POLYGON_OFFSET_FILL);
        gl.polygonOffset(1.0, 1.0);
        gl.drawArrays(gl.TRIANGLES, 0, state.triVertCount);
        gl.disable(gl.POLYGON_OFFSET_FILL);

        // 3. Optional triangle wireframe overlay
        if (showEdges3D && state.edgeVertCount > 0) {
          gl.uniform1i(state.uUseLighting, 0);
          gl.uniform3f(state.uBaseColor, 0.05, 0.15, 0.28);
          gl.bindBuffer(gl.ARRAY_BUFFER, state.edgeBuf);
          gl.enableVertexAttribArray(state.aPos);
          gl.vertexAttribPointer(state.aPos, 3, gl.FLOAT, false, 0, 0);
          gl.disableVertexAttribArray(state.aNorm);
          gl.drawArrays(gl.LINES, 0, state.edgeVertCount);
        }
      }
    }

    // Orbit / Pan / Zoom mouse & touch controls for 3D canvas
    let dragMode = null; // "orbit" | "pan"
    let lastMouseX = 0;
    let lastMouseY = 0;

    glCanvas.addEventListener("contextmenu", e => e.preventDefault());

    glCanvas.addEventListener("mousedown", e => {
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
      if (e.button === 2 || e.button === 1 || e.shiftKey) {
        dragMode = "pan";
      } else if (e.button === 0) {
        dragMode = "orbit";
      }
    });

    window.addEventListener("mousemove", e => {
      if (!dragMode || viewMode !== "3d") return;
      const dx = e.clientX - lastMouseX;
      const dy = e.clientY - lastMouseY;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;

      if (dragMode === "orbit") {
        cam.yaw -= dx * 0.008;
        cam.pitch = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, cam.pitch + dy * 0.008));
      } else if (dragMode === "pan") {
        const panScale = cam.distance * 0.0014;
        const rightX = -Math.sin(cam.yaw);
        const rightY = Math.cos(cam.yaw);
        const upX = -Math.sin(cam.pitch) * Math.cos(cam.yaw);
        const upY = -Math.sin(cam.pitch) * Math.sin(cam.yaw);
        const upZ = Math.cos(cam.pitch);

        cam.target[0] += (-dx * rightX + dy * upX) * panScale;
        cam.target[1] += (-dx * rightY + dy * upY) * panScale;
        cam.target[2] += (dy * upZ) * panScale;
      }
      render3D();
    });

    window.addEventListener("mouseup", () => {
      dragMode = null;
    });

    glCanvas.addEventListener("wheel", e => {
      if (viewMode !== "3d") return;
      e.preventDefault();
      const factor = e.deltaY > 0 ? 1.12 : 0.89;
      cam.distance = Math.max(8, Math.min(2500, cam.distance * factor));
      render3D();
    }, { passive: false });

    // ==================== 2D & Unified Draw Pipeline ====================
    function draw2D(pts, params, pitchDia, maxR, minOuterR) {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const w = rect.width;
      const h = rect.height;
      ctx.clearRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h / 2;
      const scale = (Math.min(w, h) * 0.42) / maxR;

      // Pitch circle
      ctx.save();
      ctx.strokeStyle = "rgba(148, 163, 184, 0.25)";
      ctx.setLineDash([5, 5]);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, (pitchDia / 2) * scale, 0, TWO_PI);
      ctx.stroke();
      ctx.restore();

      // Hub / boss circle preview
      if (params.hasHub && params.hubDia > 0) {
        ctx.save();
        ctx.strokeStyle = "#f59e0b";
        ctx.setLineDash([4, 3]);
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(cx, cy, (params.hubDia / 2) * scale, 0, TWO_PI);
        ctx.stroke();
        ctx.restore();
      }

      // Bolt holes & weight relief holes preview
      const { boltCircles, reliefCircles } = getCutoutLayout(params, minOuterR);

      for (const hc of boltCircles) {
        ctx.strokeStyle = "#c084fc";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(cx + hc.cx * scale, cy - hc.cy * scale, hc.r * scale, 0, TWO_PI);
        ctx.stroke();
      }
      for (const hc of reliefCircles) {
        ctx.strokeStyle = "#fb923c";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(cx + hc.cx * scale, cy - hc.cy * scale, hc.r * scale, 0, TWO_PI);
        ctx.stroke();
      }

      // Sprocket outer contour
      ctx.strokeStyle = "#4ade80";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      pts.forEach(([x, y], idx) => {
        const px = cx + x * scale;
        const py = cy - y * scale;
        if (idx === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.closePath();
      ctx.stroke();

      // Shaft bore preview
      if (params.holeDia > 0) {
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 1.6;
        if (params.boreType === "round") {
          ctx.beginPath();
          ctx.arc(cx, cy, (params.holeDia / 2) * scale, 0, TWO_PI);
          ctx.stroke();
        } else {
          const borePts = generateBorePolygon(params, 96);
          if (borePts.length > 0) {
            ctx.beginPath();
            borePts.forEach(([x, y], idx) => {
              const px = cx + x * scale;
              const py = cy - y * scale;
              if (idx === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            });
            ctx.closePath();
            ctx.stroke();
          }
        }
      }

      // Center crosshair
      ctx.strokeStyle = "rgba(248, 250, 252, 0.35)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx - 8, cy); ctx.lineTo(cx + 8, cy);
      ctx.moveTo(cx, cy - 8); ctx.lineTo(cx, cy + 8);
      ctx.stroke();
    }

    function drawPreview() {
      stepsValue.textContent = stepsInput.value;
      const P0 = parseFloat(pitchInput.value);
      const D0 = parseFloat(rollerInput.value);
      const N0 = parseInt(teethInput.value, 10);
      const steps0 = parseInt(stepsInput.value, 10);

      if (P0 > 0 && D0 > 0 && N0 >= 5 && steps0 >= 1) {
        const basePts = generateSprocketPoints(P0, D0, N0, steps0);
        let minR0 = Infinity;
        for (const [x, y] of basePts) minR0 = Math.min(minR0, Math.hypot(x, y));
        syncDefaultRingDiameters(minR0);
      }

      syncFeatureUi();
      const params = getParams();
      const { P, D, N, steps, dxfName, stlName } = params;
      filePreview.textContent = `${dxfName} / ${stlName}`;

      if (!(P > 0 && D > 0 && N >= 5 && steps >= 1)) {
        dimPreview.textContent = "Please enter valid parameters";
        return;
      }

      const pts = generateSprocketPoints(P, D, N, steps);
      const pitchDia = P / Math.sin(Math.PI / N);
      dimPreview.textContent = `Pitch diameter: ${pitchDia.toFixed(2)} mm | Outline segments: ${pts.length}`;

      let maxR = 1;
      let minOuterR = Infinity;
      for (const [x, y] of pts) {
        const r = Math.hypot(x, y);
        maxR = Math.max(maxR, r);
        minOuterR = Math.min(minOuterR, r);
      }

      if (viewMode === "2d") {
        draw2D(pts, params, pitchDia, maxR, minOuterR);
      } else {
        updateWebGLMesh(pts, params);
        render3D();
      }
    }

    function setViewMode(mode) {
      viewMode = mode;
      const is3D = mode === "3d";
      mode2dBtn.classList.toggle("active", !is3D);
      mode3dBtn.classList.toggle("active", is3D);
      canvas.classList.toggle("hidden", is3D);
      glCanvas.classList.toggle("hidden", !is3D);
      tools3d.classList.toggle("hidden", !is3D);
      controlsHint3d.classList.toggle("hidden", !is3D);
      drawPreview();
    }

    mode2dBtn.addEventListener("click", () => setViewMode("2d"));
    mode3dBtn.addEventListener("click", () => setViewMode("3d"));

    toggleEdgesBtn.addEventListener("click", () => {
      showEdges3D = !showEdges3D;
      toggleEdgesBtn.classList.toggle("active-alt", showEdges3D);
      render3D();
    });

    resetCamBtn.addEventListener("click", () => {
      if (glState) {
        resetCamera(glState.lastMaxR, glState.lastMaxZ);
      } else {
        cam.initialized = false;
      }
      drawPreview();
    });

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function activateTab(key) {
      for (const k of Object.keys(tileButtons)) {
        tileButtons[k].classList.toggle("active", k === key);
        subPanels[k].classList.toggle("hidden", k !== key);
      }
    }

    tileButtons.bore.addEventListener("click", () => activateTab("bore"));
    tileButtons.hub.addEventListener("click", () => activateTab("hub"));
    tileButtons.bolts.addEventListener("click", () => activateTab("bolts"));
    tileButtons.relief.addEventListener("click", () => activateTab("relief"));

    boltPcdInput.addEventListener("input", () => { customBoltPcd = true; });
    reliefPcdInput.addEventListener("input", () => { customReliefPcd = true; });

    boltsEnabledSelect.addEventListener("change", () => {
      if (boltsEnabledSelect.value === "bolts") customBoltPcd = false;
    });
    reliefEnabledSelect.addEventListener("change", () => {
      if (reliefEnabledSelect.value === "relief") customReliefPcd = false;
    });

    downloadDxfBtn.addEventListener("click", () => {
      const params = getParams();
      if (!(params.P > 0 && params.D > 0 && params.N >= 5 && params.steps >= 1)) {
        alert("Please check input parameters (pitch > 0, roller > 0, teeth >= 5).");
        return;
      }
      const pts = generateSprocketPoints(params.P, params.D, params.N, params.steps);
      const dxfContent = buildDxf(pts, params);
      triggerDownload(new Blob([dxfContent], { type: "application/dxf;charset=utf-8" }), params.dxfName);
    });

    downloadStlBtn.addEventListener("click", () => {
      const params = getParams();
      if (!(params.P > 0 && params.D > 0 && params.N >= 5 && params.thickness > 0 && params.steps >= 1)) {
        alert("Please check input parameters (pitch > 0, roller > 0, teeth >= 5, thickness > 0).");
        return;
      }
      const pts = generateSprocketPoints(params.P, params.D, params.N, params.steps);
      const stlBuffer = buildBinaryStl(pts, params);
      triggerDownload(new Blob([stlBuffer], { type: "application/octet-stream" }), params.stlName);
    });

    resetThicknessBtn.addEventListener("click", () => {
      thicknessInput.value = getDefaultThickness();
      drawPreview();
    });

    chainSelect.addEventListener("change", () => { syncChainFields(); drawPreview(); });
    [
      pitchInput, rollerInput, teethInput, holeInput, thicknessInput, stepsInput,
      boreTypeSelect, keyWidthInput, keyDepthInput, dFlatInput,
      hubEnabledSelect, hubDiaInput, hubHeightInput,
      boltsEnabledSelect, boltCountInput, boltDiaInput, boltPcdInput,
      reliefEnabledSelect, reliefCountInput, reliefDiaInput, reliefPcdInput
    ].forEach(el => {
      el.addEventListener("input", drawPreview);
      el.addEventListener("change", drawPreview);
    });
    window.addEventListener("resize", drawPreview);

    syncChainFields();
    drawPreview();
  </script>
</body>
</html>
