<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sprocket Generator — Web DXF</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #0f172a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      background: #111827;
    }
    header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
    }
    header span {
      color: var(--muted);
      font-size: 0.85rem;
    }
    main {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      padding: 16px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }
    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 10px 0;
    }
    .group { margin-bottom: 12px; }
    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 4px;
      color: #e2e8f0;
    }
    select, input[type="number"] {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 0.95rem;
    }
    input[readonly] {
      opacity: 0.7;
      cursor: not-allowed;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    .range-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--muted);
    }
    button {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #052e16;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.15s ease;
    }
    button:hover { background: var(--accent-hover); }
    .preview-wrap {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 420px;
    }
    .canvas-box {
      flex: 1;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .meta {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .meta code {
      color: #86efac;
      background: rgba(34, 197, 94, 0.1);
      padding: 2px 6px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Sprocket Generator — DXF (AC1009 / R12)</h1>
    <span>Live Preview • Bore as CIRCLE • DIN/ISO &amp; Karting</span>
  </header>

  <main>
    <aside class="card">
      <h2 class="section-title">1. Chain Parameters</h2>
      <div class="group">
        <label for="chainSelect">Chain Standard</label>
        <select id="chainSelect"></select>
      </div>
      <div class="group">
        <label for="pitchInput">Pitch (P) [mm]</label>
        <input type="number" id="pitchInput" step="0.001" min="0.1" />
      </div>
      <div class="group">
        <label for="rollerInput">Roller Diameter (D) [mm]</label>
        <input type="number" id="rollerInput" step="0.001" min="0.1" />
      </div>

      <h2 class="section-title" style="margin-top:18px;">2. Sprocket Geometry</h2>
      <div class="group">
        <label for="teethInput">Number of Teeth (Z)</label>
        <input type="number" id="teethInput" min="5" max="500" step="1" value="40" />
      </div>
      <div class="group">
        <label for="holeInput">Shaft Bore (D) [mm]</label>
        <input type="number" id="holeInput" min="0" max="500" step="0.5" value="20" />
      </div>
      <div class="group">
        <div class="range-row">
          <label for="stepsInput" style="margin:0;">Arc Smoothness (segments)</label>
          <span id="stepsValue">15</span>
        </div>
        <input type="range" id="stepsInput" min="5" max="60" step="1" value="15" />
      </div>

      <button id="downloadBtn" type="button">DOWNLOAD DXF FILE</button>
    </aside>

    <section class="card preview-wrap">
      <div class="canvas-box">
        <canvas id="previewCanvas"></canvas>
      </div>
      <div class="meta">
        <div>Output file: <code id="filePreview">-</code></div>
        <div id="dimPreview">Pitch diameter: -</div>
      </div>
    </section>
  </main>

  <script>
    const CHAIN_DATA = {
      "#219 (Karting)": { pitch: 7.77, roller: 4.78 },
      "#25 (Karting)": { pitch: 6.35, roller: 3.30 },
      "#35 (Karting)": { pitch: 9.525, roller: 5.08 },
      "#40 (Karting)": { pitch: 12.70, roller: 7.95 },

      "03-1 (5mm)": { pitch: 5.00, roller: 1.49 },
      "04-1 (6mm)": { pitch: 6.00, roller: 1.85 },
      "05B-1 (8mm)": { pitch: 8.00, roller: 2.31 },
      '06B-1 (3/8")': { pitch: 9.525, roller: 3.28 },
      '08B-1 (1/2")': { pitch: 12.70, roller: 4.45 },
      '081 (1/2")': { pitch: 12.70, roller: 3.66 },
      '084 (1/2")': { pitch: 12.70, roller: 4.09 },
      '10B-1 (5/8")': { pitch: 15.875, roller: 5.08 },
      '12B-1 (3/4")': { pitch: 19.05, roller: 5.72 },
      '16B-1 (1")': { pitch: 25.40, roller: 8.28 },
      '20B-1 (1 1/4")': { pitch: 31.75, roller: 10.19 },
      '24B-1 (1 1/2")': { pitch: 38.10, roller: 14.63 },
      '28B-1 (1 3/4")': { pitch: 44.45, roller: 15.90 },
      '32B-1 (2")': { pitch: 50.80, roller: 17.81 },
      '40B-1 (2 1/2")': { pitch: 63.50, roller: 22.89 },

      "CUSTOM": { pitch: 0, roller: 0 }
    };

    const TWO_PI = Math.PI * 2;
    const chainSelect = document.getElementById("chainSelect");
    const pitchInput = document.getElementById("pitchInput");
    const rollerInput = document.getElementById("rollerInput");
    const teethInput = document.getElementById("teethInput");
    const holeInput = document.getElementById("holeInput");
    const stepsInput = document.getElementById("stepsInput");
    const stepsValue = document.getElementById("stepsValue");
    const downloadBtn = document.getElementById("downloadBtn");
    const canvas = document.getElementById("previewCanvas");
    const ctx = canvas.getContext("2d");
    const filePreview = document.getElementById("filePreview");
    const dimPreview = document.getElementById("dimPreview");

    for (const name of Object.keys(CHAIN_DATA)) {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      chainSelect.appendChild(opt);
    }
    chainSelect.value = '08B-1 (1/2")';

    function mod2Pi(a) {
      return ((a % TWO_PI) + TWO_PI) % TWO_PI;
    }

    function interpolateArc(center, r, startAngle, endAngle, steps = 15) {
      let a0 = mod2Pi(startAngle);
      let a1 = mod2Pi(endAngle);
      let diff = a1 - a0;
      if (diff > Math.PI) a1 -= TWO_PI;
      else if (diff < -Math.PI) a1 += TWO_PI;

      const pts = [];
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const a = a0 + t * (a1 - a0);
        pts.push([center[0] + r * Math.cos(a), center[1] + r * Math.sin(a)]);
      }
      return pts;
    }

    function generateSprocketPoints(P, D, N, stepsPerArc = 15) {
      const Rp = P / (2 * Math.sin(Math.PI / N));
      const xc = Rp * Math.cos(Math.PI / N);
      const yc = P / 2;
      const R1 = D / 2 + 0.1;
      const X_tip = xc - R1 + 0.6 * P;
      const clampedCos = Math.max(-1, Math.min(1, (R1 - 0.2 * P) / R1));
      const thetaSweep = Math.acos(clampedCos);

      const P_tip_top = [X_tip, 0.05 * P];
      const P_tip_bot = [X_tip, -0.05 * P];

      const d_L1_x = Math.cos(Math.PI + thetaSweep);
      const d_L1_y = Math.sin(Math.PI + thetaSweep);
      const P_1end_top = [xc + R1 * d_L1_x, yc + R1 * d_L1_y];

      const v12_x = P_tip_top[0] - P_1end_top[0];
      const v12_y = P_tip_top[1] - P_1end_top[1];
      const dot = d_L1_x * v12_x + d_L1_y * v12_y;
      const s = Math.abs(dot) > 1e-6 ? (v12_x * v12_x + v12_y * v12_y) / (2 * dot) : 0;

      const C2_top = [P_1end_top[0] + s * d_L1_x, P_1end_top[1] + s * d_L1_y];
      const R2_top = Math.hypot(C2_top[0] - P_1end_top[0], C2_top[1] - P_1end_top[1]);

      const P_1end_bot = [P_1end_top[0], -P_1end_top[1]];
      const C2_bot = [C2_top[0], -C2_top[1]];
      const C_bot = [xc, -yc];
      const C_top = [xc, yc];

      const a_bot_flank_start = Math.atan2(P_1end_bot[1] - C2_bot[1], P_1end_bot[0] - C2_bot[0]);
      const a_bot_flank_end = Math.atan2(P_tip_bot[1] - C2_bot[1], P_tip_bot[0] - C2_bot[0]);
      const a_top_flank_start = Math.atan2(P_tip_top[1] - C2_top[1], P_tip_top[0] - C2_top[0]);
      const a_top_flank_end = Math.atan2(P_1end_top[1] - C2_top[1], P_1end_top[0] - C2_top[0]);

      const baseTooth = [
        ...interpolateArc(C_bot, R1, Math.PI - Math.PI / N, Math.PI - thetaSweep, stepsPerArc),
        ...interpolateArc(C2_bot, R2_top, a_bot_flank_start, a_bot_flank_end, stepsPerArc),
        P_tip_top,
        ...interpolateArc(C2_top, R2_top, a_top_flank_start, a_top_flank_end, stepsPerArc),
        ...interpolateArc(C_top, R1, Math.PI + thetaSweep, Math.PI + Math.PI / N, stepsPerArc),
      ];

      const allPoints = [];
      for (let i = 0; i < N; i++) {
        const angle = i * (TWO_PI / N);
        const ca = Math.cos(angle);
        const sa = Math.sin(angle);
        for (const [x, y] of baseTooth) {
          const xr = x * ca - y * sa;
          const yr = x * sa + y * ca;
          const last = allPoints[allPoints.length - 1];
          if (!last || Math.hypot(last[0] - xr, last[1] - yr) > 1e-4) {
            allPoints.push([xr, yr]);
          }
        }
      }
      return allPoints;
    }

    function getParams() {
      const P = parseFloat(pitchInput.value);
      const D = parseFloat(rollerInput.value);
      const N = parseInt(teethInput.value, 10);
      const holeDia = parseFloat(holeInput.value);
      const steps = parseInt(stepsInput.value, 10);
      const chainShort = chainSelect.value.split(" ")[0].replace("#", "ANSI");
      const filename = `${chainShort}_Z${N}_D${Math.round(holeDia)}.dxf`;
      return { P, D, N, holeDia, steps, filename };
    }

    function syncChainFields() {
      const choice = chainSelect.value;
      if (choice !== "CUSTOM" && CHAIN_DATA[choice]) {
        pitchInput.value = CHAIN_DATA[choice].pitch;
        rollerInput.value = CHAIN_DATA[choice].roller;
        pitchInput.readOnly = true;
        rollerInput.readOnly = true;
      } else {
        pitchInput.readOnly = false;
        rollerInput.readOnly = false;
      }
    }

    function drawPreview() {
      stepsValue.textContent = stepsInput.value;
      const { P, D, N, holeDia, steps, filename } = getParams();
      filePreview.textContent = filename;

      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const w = rect.width;
      const h = rect.height;
      ctx.clearRect(0, 0, w, h);

      if (!(P > 0 && D > 0 && N >= 5 && steps >= 1)) {
        dimPreview.textContent = "Please enter valid parameters";
        return;
      }

      const pts = generateSprocketPoints(P, D, N, steps);
      const pitchDia = P / Math.sin(Math.PI / N);
      dimPreview.textContent = `Pitch diameter: ${pitchDia.toFixed(2)} mm | Outline segments: ${pts.length}`;

      let maxR = 1;
      for (const [x, y] of pts) {
        maxR = Math.max(maxR, Math.hypot(x, y));
      }

      const cx = w / 2;
      const cy = h / 2;
      const scale = (Math.min(w, h) * 0.42) / maxR;

      // Pitch circle
      ctx.save();
      ctx.strokeStyle = "rgba(148, 163, 184, 0.25)";
      ctx.setLineDash([5, 5]);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, (pitchDia / 2) * scale, 0, TWO_PI);
      ctx.stroke();
      ctx.restore();

      // Sprocket outline (OBRYS)
      ctx.strokeStyle = "#4ade80";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      pts.forEach(([x, y], idx) => {
        const px = cx + x * scale;
        const py = cy - y * scale;
        if (idx === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.closePath();
      ctx.stroke();

      // Center bore (OTWOR)
      if (holeDia > 0) {
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(cx, cy, (holeDia / 2) * scale, 0, TWO_PI);
        ctx.stroke();
      }

      // Center crosshair
      ctx.strokeStyle = "rgba(248, 250, 252, 0.35)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx - 8, cy); ctx.lineTo(cx + 8, cy);
      ctx.moveTo(cx, cy - 8); ctx.lineTo(cx, cy + 8);
      ctx.stroke();
    }

    function buildDxf(pts, holeDia) {
      let dxf = "0\nSECTION\n2\nHEADER\n9\n$ACADVER\n1\nAC1009\n0\nENDSEC\n0\nSECTION\n2\nENTITIES\n";
      for (let i = 0; i < pts.length; i++) {
        const p1 = pts[i];
        const p2 = pts[(i + 1) % pts.length];
        dxf +=
          `0\nLINE\n8\nOBRYS\n` +
          `10\n${p1[0].toFixed(4)}\n20\n${p1[1].toFixed(4)}\n30\n0.0\n` +
          `11\n${p2[0].toFixed(4)}\n21\n${p2[1].toFixed(4)}\n31\n0.0\n`;
      }
      const hr = holeDia / 2;
      if (hr > 0) {
        dxf +=
          `0\nCIRCLE\n8\nOTWOR\n` +
          `10\n0.0\n20\n0.0\n30\n0.0\n` +
          `40\n${hr.toFixed(4)}\n`;
      }
      dxf += "0\nENDSEC\n0\nEOF\n";
      return dxf;
    }

    downloadBtn.addEventListener("click", () => {
      const { P, D, N, holeDia, steps, filename } = getParams();
      if (!(P > 0 && D > 0 && N >= 5 && steps >= 1)) {
        alert("Please check input parameters (pitch > 0, roller > 0, teeth >= 5).");
        return;
      }
      const pts = generateSprocketPoints(P, D, N, steps);
      const dxfContent = buildDxf(pts, holeDia);
      const blob = new Blob([dxfContent], { type: "application/dxf;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    chainSelect.addEventListener("change", () => { syncChainFields(); drawPreview(); });
    [pitchInput, rollerInput, teethInput, holeInput, stepsInput].forEach(el => {
      el.addEventListener("input", drawPreview);
    });
    window.addEventListener("resize", drawPreview);

    syncChainFields();
    drawPreview();
  </script>
</body>
</html>
